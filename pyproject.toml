[project]
name = "reifier"
version = "0.0.2"
description = "Neural network compilation"
authors = [{name = "Andis Draguns"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.1"
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.13.1",
]
